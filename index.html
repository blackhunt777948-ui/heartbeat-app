<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalp Atışı Bağlantısı ❤️</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { background: radial-gradient(circle at center, #1e1b4b, #0f172a); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; overflow: hidden; position: relative; }
    
    h1 { font-size: 1.8rem; color: #f43f5e; margin-bottom: 10px; text-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
    p { color: #94a3b8; margin-bottom: 25px; font-size: 0.95rem; }

    .pin-container { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 20px; border-radius: 16px; margin-bottom: 25px; border: 1px solid rgba(51, 65, 85, 0.5); width: 100%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .pin-container label { display: block; font-size: 0.85rem; color: #38bdf8; margin-bottom: 8px; }
    .pin-container input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; text-align: center; font-size: 1.2rem; letter-spacing: 3px; outline: none; }
    
    .save-btn { margin-top: 15px; width: 100%; padding: 12px; font-size: 0.95rem; border-radius: 8px; background: #38bdf8; color: #0f172a; border: none; cursor: pointer; font-weight: bold; box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3); }

    .heart-wrapper { position: relative; display: inline-block; margin-top: 20px; }
    .heart-btn { background: linear-gradient(135deg, #f43f5e, #e11d48); color: white; border: none; width: 140px; height: 140px; font-size: 3.5rem; border-radius: 50%; cursor: pointer; box-shadow: 0 0 30px rgba(244, 63, 94, 0.6); outline: none; display: flex; align-items: center; justify-content: center; transition: transform 0.1s; }
    .heart-btn:active { transform: scale(0.88); box-shadow: 0 0 15px rgba(244, 63, 94, 0.8); }

    .pulse-ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; border-radius: 50%; border: 2px solid rgba(244, 63, 94, 0.6); animation: pulseAnim 2s infinite; pointer-events: none; }
    @keyframes pulseAnim {
      0% { width: 140px; height: 140px; opacity: 1; }
      100% { width: 240px; height: 240px; opacity: 0; }
    }

    #status { margin-top: 25px; color: #38bdf8; font-size: 0.9rem; }

    .floating-heart { position: absolute; font-size: 1.8rem; color: #f43f5e; user-select: none; pointer-events: none; animation: floatUp 1.5s ease-out forwards; z-index: 100; }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.6); opacity: 1; }
      100% { transform: translateY(-160px) scale(1.4); opacity: 0; }
    }
  </style>

  <!-- فائر بیس کی لائبریریاں -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>❤️ Kalp Atışı Bağlantısı ❤️</h1>
  <p>Butona dokun, kalbin aynı anda atsın!</p>

  <div class="pin-container" id="pinBox">
    <label for="pinInput">Gizli PIN Kodu (Ortak Şifre):</label>
    <input type="password" id="pinInput" placeholder="Örn: 7779" />
    <button class="save-btn" onclick="lockPin()">Kaydet & Başla</button>
  </div>

  <div id="appInterface" style="display: none;">
    <div class="heart-wrapper">
      <div class="pulse-ring"></div>
      <button class="heart-btn" onclick="sendRealtimeSignal()">❤️</button>
    </div>
    <div id="status">Bağlantı kuruldu! Dokun ve hissettir...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAq9YcI7elloPxpARxpq1nIi4",
      authDomain: "kalp-atisi-31908.firebaseapp.com",
      databaseURL: "https://kalp-atisi-31908-default-rtdb.firebaseio.com",
      projectId: "kalp-atisi-31908",
      storageBucket: "kalp-atisi-31908.appspot.com",
      messagingSenderId: "528037346484",
      appId: "1:528037346484:web:3ac7608dc689"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const pinBox = document.getElementById('pinBox');
    const appInterface = document.getElementById('appInterface');
    const pinInput = document.getElementById('pinInput');

    let currentPin = localStorage.getItem('saved_love_pin');
    let dbRef = null;
    let isProcessing = false;

    if (currentPin) {
      pinBox.style.display = 'none';
      appInterface.style.display = 'block';
      initRealtimeSync(currentPin);
    }

    function lockPin() {
      const pin = pinInput.value.trim();
      if (pin.length < 3) return alert("Lütfen geçerli bir PIN girin!");
      localStorage.setItem('saved_love_pin', pin);
      currentPin = pin;
      pinBox.style.display = 'none';
      appInterface.style.display = 'block';
      initRealtimeSync(currentPin);
    }

    function initRealtimeSync(pin) {
      // فائر بیس میں اس پن کے لیے مخصوص پاتھ بنانا
      dbRef = db.ref('heartbeats/' + pin);

      // جب بھی فائر بیس پر کوئی سگنل آئے گا، یہ خود بخود رن ہوگا
      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data && data.timestamp) {
          // اگر سگنل نیا ہے تو وائبریٹ کرو
          const now = Date.now();
          if (now - data.timestamp < 5000 && !isProcessing) {
            triggerVibration();
            spawnFloatingHearts();
          }
        }
      });
    }

    function sendRealtimeSignal() {
      if (!currentPin || !dbRef) return;
      
      triggerVibration();
      spawnFloatingHearts();

      isProcessing = true;
      // فائر بیس پر نیا ٹائم اسٹیمپ بھیجنا تاکہ دوسرے فون کو فوراً پتہ چل جائے
      dbRef.set({
        timestamp: Date.now(),
        sender: navigator.userAgent.includes('Mobile') ? 'Phone' : 'PC'
      }).then(() => {
        setTimeout(() => { isProcessing = false; }, 1000);
      });
    }

    function triggerVibration() {
      if ('vibrate' in navigator) {
        navigator.vibrate([400, 150, 400, 150, 800]);
      }
    }

    function spawnFloatingHearts() {
      const container = document.body;
      for (let i = 0; i < 6; i++) {
        const heart = document.createElement('div');
        heart.className = 'floating-home floating-heart';
        heart.innerHTML = '❤️';
        
        const randomX = (Math.random() - 0.5) * 120;
        heart.style.left = `calc(50% + ${randomX}px)`;
        heart.style.bottom = '180px';
        
        container.appendChild(heart);
        
        setTimeout(() => {
          heart.remove();
        }, 1500);
      }
    }
  </script>
</body>
</html>
